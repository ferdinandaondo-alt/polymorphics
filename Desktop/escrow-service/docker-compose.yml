# Production-style stack: PostgreSQL + API + web server (Caddy, HTTPS).
#   cp .env.example .env   (then fill it in)   ->   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: escrow
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://escrow:${POSTGRES_PASSWORD}@db:5432/escrow
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      # tunables (optional):
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-250}
      KYC_THRESHOLD: ${KYC_THRESHOLD:-100000}
    # no "ports:" on purpose - the database and API are NOT reachable from the internet, only via the web service

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data          # keeps your HTTPS certificates between restarts
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
